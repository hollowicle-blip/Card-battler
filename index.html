<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авто Батлер 3x3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Segoe UI',sans-serif;max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.screen{display:none;padding:10px;min-height:100vh}
.screen.active{display:block}
.menu-title{text-align:center;font-size:1.8em;margin:30px 0 5px}
.menu-sub{text-align:center;color:#888;margin-bottom:25px;font-size:0.85em}
.menu-coins{text-align:center;font-size:1.1em;margin:10px 0;color:#f5a623}
.menu-btn{display:block;width:100%;padding:16px;margin:8px 0;border:2px solid #0f3460;background:#16213e;color:#eee;border-radius:12px;font-size:1em;text-align:left}
.menu-btn:active{background:#0f3460}
.menu-btn .mb-icon{font-size:1.3em;margin-right:8px}
.menu-btn .mb-desc{color:#888;font-size:0.8em;display:block;margin-top:2px}
.topbar{display:flex;align-items:center;padding:8px;gap:8px;border-bottom:1px solid #333}
.topbar .back{background:none;border:none;color:#eee;font-size:1.3em}
.topbar .title{flex:1;font-weight:bold;font-size:1em}
.topbar .coins{color:#f5a623;font-size:0.9em}
.card-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 0}
.card-mini{background:#16213e;border:2px solid #0f3460;border-radius:10px;padding:6px;width:105px;text-align:center;font-size:0.7em;cursor:pointer;transition:all 0.2s;position:relative}
.card-mini:active{transform:scale(0.95)}
.card-mini.selected{border-color:#4ecdc4;box-shadow:0 0 8px #4ecdc466}
.card-mini.locked{opacity:0.3;pointer-events:none}
.card-mini .emo{font-size:1.8em}
.card-mini .cname{font-weight:bold;margin:2px 0;font-size:0.95em}
.card-mini .cstats{color:#aaa;font-size:0.9em}
.card-mini .crarity{font-size:0.75em;margin-top:2px}
.rarity-common .crarity{color:#aaa}
.rarity-rare .crarity{color:#4ea8de}
.rarity-rare{border-color:#4ea8de44}
.rarity-epic .crarity{color:#a855f7}
.rarity-epic{border-color:#a855f744}
.rarity-legendary .crarity{color:#f5a623}
.rarity-legendary{border-color:#f5a62344}
.pack{background:#16213e;border:2px solid #0f3460;border-radius:14px;padding:16px;margin:8px 0;text-align:center;cursor:pointer}
.pack:active{background:#0f3460}
.pack .pack-icon{font-size:2.5em}
.pack .pack-name{font-weight:bold;margin:6px 0;font-size:1.05em}
.pack .pack-info{color:#888;font-size:0.8em}
.pack .pack-price{color:#f5a623;font-size:1em;margin-top:6px}
.pack.pack-free{border-color:#4ecdc4}
.pack.pack-free .pack-price{color:#4ecdc4}
.pack-disabled{opacity:0.4;pointer-events:none}
.pack-reveal{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a1aee;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
.pack-reveal.active{display:flex}
.pack-reveal .pr-title{font-size:1.3em;margin-bottom:15px}
.pack-reveal .pr-cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pack-reveal .pr-card{background:#16213e;border:2px solid #0f3460;border-radius:12px;padding:10px 6px;width:100px;text-align:center;animation:cardReveal 0.5s ease-out both}
@keyframes cardReveal{from{transform:scale(0) rotateY(180deg);opacity:0}to{transform:scale(1) rotateY(0);opacity:1}}
.pack-reveal .pr-card:nth-child(2){animation-delay:0.15s}
.pack-reveal .pr-card:nth-child(3){animation-delay:0.3s}
.pack-reveal .pr-card:nth-child(4){animation-delay:0.45s}
.pack-reveal .pr-card:nth-child(5){animation-delay:0.6s}
.pack-reveal .pr-card:nth-child(6){animation-delay:0.75s}
.pack-reveal .pr-card .emo{font-size:1.8em}
.pack-reveal .pr-card .cname{font-weight:bold;font-size:0.85em;margin:3px 0}
.pr-close{margin-top:20px;padding:12px 40px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:1em}
.arena{padding:5px}
.arena .label{text-align:center;font-size:0.75em;color:#888;margin:4px}
.arena .team{display:flex;gap:5px;justify-content:center}
.arena .vs{text-align:center;font-size:1.2em;color:#e94560;margin:6px}
.arena .card-b{background:#16213e;border:2px solid #0f3460;border-radius:10px;padding:6px;width:105px;text-align:center;font-size:0.7em}
.arena .card-b.dead{opacity:0.15}
.arena .card-b .emo{font-size:1.8em}
.arena .card-b .cname{font-weight:bold;margin:2px 0}
.arena .card-b .atk-v{color:#f5a623}
.arena .card-b .hp-v{color:#e94560}
.fight-btn{display:block;width:100%;padding:14px;margin:8px 0;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:1.1em;font-weight:bold}
.fight-btn:disabled{background:#555}
#battle-log{background:#0a0a1a;border:1px solid #333;border-radius:8px;padding:8px;height:250px;overflow-y:auto;font-size:0.72em;line-height:1.6}
.lr{color:#555;border-top:1px solid #222;padding-top:3px;margin-top:3px}
.lh{color:#f5a623}.lp{color:#a78bfa}.lk{color:#e94560;font-weight:bold}
.lw{color:#4ecdc4;font-weight:bold;font-size:1.2em;text-align:center}
.ls{color:#60a5fa}
.selection-info{text-align:center;color:#888;font-size:0.85em;margin:8px 0}
.confirm-btn{display:block;width:100%;padding:12px;margin:8px 0;background:#4ecdc4;color:#1a1a2e;border:none;border-radius:8px;font-size:1em;font-weight:bold}
.confirm-btn:disabled{background:#555;color:#999}
</style>
</head>
<body>
  <!-- МЕНЮ -->
<div class="screen active" id="screen-menu">
  <div class="menu-title">⚔️ AutoBattler</div>
  <div class="menu-sub">Коллекционный карточный автобатлер</div>
  <div class="menu-coins" id="menu-coins">🪙 0</div>
  <button class="menu-btn" onclick="showScreen('screen-battle-pick')">
    <span class="mb-icon">⚔️</span> Вступить в бой
    <span class="mb-desc">Выбери 3 карты и атакуй</span>
  </button>
  <button class="menu-btn" onclick="showScreen('screen-defense')">
    <span class="mb-icon">🛡️</span> Команда защиты
    <span class="mb-desc">Настрой защиту от атак</span>
  </button>
  <button class="menu-btn" onclick="showScreen('screen-collection')">
    <span class="mb-icon">📖</span> Коллекция
    <span class="mb-desc" id="coll-count">Карт: 0 / 10</span>
  </button>
  <button class="menu-btn" onclick="showScreen('screen-shop')">
    <span class="mb-icon">🎁</span> Магазин паков
    <span class="mb-desc">Открывай паки, собирай карты</span>
  </button>
</div>

<!-- КОЛЛЕКЦИЯ -->
<div class="screen" id="screen-collection">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-menu')">←</button>
    <div class="title">📖 Коллекция</div>
    <div class="coins" id="coll-coins">🪙 0</div>
  </div>
  <div class="card-grid" id="collection-grid"></div>
</div>

<!-- МАГАЗИН -->
<div class="screen" id="screen-shop">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-menu')">←</button>
    <div class="title">🎁 Магазин</div>
    <div class="coins" id="shop-coins">🪙 0</div>
  </div>
  <div id="shop-packs"></div>
</div>

<!-- ОТКРЫТИЕ ПАКА -->
<div class="pack-reveal" id="pack-reveal">
  <div class="pr-title" id="pr-title">🎁 Открытие пака!</div>
  <div class="pr-cards" id="pr-cards"></div>
  <button class="pr-close" onclick="closeReveal()">Забрать!</button>
</div>

<!-- ЗАЩИТА -->
<div class="screen" id="screen-defense">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-menu')">←</button>
    <div class="title">🛡️ Команда защиты</div>
  </div>
  <div class="selection-info">Выбери 3 карты для защиты</div>
  <div class="card-grid" id="defense-grid"></div>
  <button class="confirm-btn" id="def-confirm" disabled onclick="saveDefense()">Сохранить защиту</button>
</div>

<!-- ВЫБОР АТАКИ -->
<div class="screen" id="screen-battle-pick">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-menu')">←</button>
    <div class="title">⚔️ Выбери команду</div>
  </div>
  <div class="selection-info">Выбери 3 карты для атаки</div>
  <div class="card-grid" id="attack-grid"></div>
  <button class="confirm-btn" id="atk-confirm" disabled onclick="startBattleScreen()">В бой!</button>
</div>

<!-- БОЙ -->
<div class="screen" id="screen-battle">
  <div class="topbar">
    <button class="back" onclick="showScreen('screen-menu')">←</button>
    <div class="title">⚔️ Арена</div>
  </div>
  <div class="arena">
    <div class="label">— ТВОЯ АТАКА —</div>
    <div class="team" id="b-team-a"></div>
    <div class="vs">⚔️ VS ⚔️</div>
    <div class="label">— ЗАЩИТА ВРАГА —</div>
    <div class="team" id="b-team-d"></div>
  </div>
  <button class="fight-btn" id="fight-btn" onclick="runBattle()">⚔️ НАЧАТЬ БОЙ</button>
  <div id="battle-log"></div>
  </div>
  <script>
// === БАЗА КАРТ ===
const ALL_CARDS = [
  {id:"mario",name:"Марио",emoji:"🍄",atk:3,hp:10,rarity:"common",passiveName:"Супер-гриб",passiveDesc:"HP<5: +4HP +1ATK (1 раз)",pack:"nintendo"},
  {id:"pikachu",name:"Пикачу",emoji:"⚡",atk:5,hp:8,rarity:"common",passiveName:"Статика",passiveDesc:"50%: +2 доп. урона",pack:"nintendo"},
  {id:"sonic",name:"Соник",emoji:"💨",atk:4,hp:7,rarity:"rare",passiveName:"Ускорение",passiveDesc:"Всегда бьёт первым",pack:"classic"},
  {id:"steve",name:"Стив",emoji:"⛏️",atk:3,hp:11,rarity:"common",passiveName:"Крафт доспехов",passiveDesc:"Атака: +1 макс HP",pack:"classic"},
  {id:"lara",name:"Лара Крофт",emoji:"🔫",atk:4,hp:9,rarity:"rare",passiveName:"Сокровища",passiveDesc:"Убийство: союзник +2HP",pack:"classic"},
  {id:"knight",name:"Рыцарь",emoji:"🖤",atk:3,hp:9,rarity:"rare",passiveName:"Фокус Душ",passiveDesc:"Нанёс урон: +1HP",pack:"rpg"},
  {id:"geralt",name:"Геральт",emoji:"🐺",atk:4,hp:12,rarity:"epic",passiveName:"Эликсиры",passiveDesc:"Враг сильнее: +2ATK",pack:"rpg"},
  {id:"chief",name:"Мастер Чиф",emoji:"🤖",atk:3,hp:14,rarity:"epic",passiveName:"Энергощит",passiveDesc:"Блок первых 3 урона",pack:"shooter"},
  {id:"doom",name:"Палач Рока",emoji:"👹",atk:3,hp:13,rarity:"epic",passiveName:"Добивание",passiveDesc:"Враг ≤3HP: убийство",pack:"shooter"},
  {id:"kratos",name:"Кратос",emoji:"🪓",atk:2,hp:15,rarity:"legendary",passiveName:"Ярость спартанца",passiveDesc:"Получил урон: +1ATK",pack:"rpg"}
];

const RARITY_LABEL={common:"Обычная",rare:"Редкая",epic:"Эпическая",legendary:"Легендарная"};
const RARITY_WEIGHTS={common:60,rare:25,epic:12,legendary:3};

const PACKS = [
  {id:"daily",name:"Ежедневный пак",icon:"🎁",cards:3,price:0,desc:"3 карты бесплатно раз в день",filter:null,daily:true},
  {id:"standard",name:"Стандартный пак",icon:"📦",cards:6,price:100,desc:"6 карт из всех серий",filter:null},
  {id:"nintendo",name:"Пак Nintendo",icon:"🎮",cards:6,price:120,desc:"Повышен шанс: Марио, Пикачу",filter:"nintendo"},
  {id:"rpg",name:"Пак RPG",icon:"⚔️",cards:6,price:120,desc:"Повышен шанс: Геральт, Кратос, Рыцарь",filter:"rpg"},
  {id:"shooter",name:"Пак Стрелки",icon:"🔫",cards:6,price:120,desc:"Повышен шанс: Мастер Чиф, Палач Рока",filter:"shooter"}
];

// === СОХРАНЕНИЕ ===
let gameState = loadState();
function loadState(){
  const s=localStorage.getItem("autobattler_save");
  if(s)return JSON.parse(s);
  return{coins:200,collection:[],defense:[],lastDaily:null,wins:0,losses:0};
}
function saveState(){localStorage.setItem("autobattler_save",JSON.stringify(gameState))}

// === НАВИГАЦИЯ ===
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="screen-menu")refreshMenu();
  if(id==="screen-collection")refreshCollection();
  if(id==="screen-shop")refreshShop();
  if(id==="screen-defense")refreshDefense();
  if(id==="screen-battle-pick")refreshAttackPick();
}

// === МЕНЮ ===
function refreshMenu(){
  document.getElementById("menu-coins").textContent=`🪙 ${gameState.coins}`;
  const u=[...new Set(gameState.collection)].length;
  document.getElementById("coll-count").textContent=`Карт: ${u} / ${ALL_CARDS.length} | Побед: ${gameState.wins}`;
}

// === КОЛЛЕКЦИЯ ===
function refreshCollection(){
  document.getElementById("coll-coins").textContent=`🪙 ${gameState.coins}`;
  document.getElementById("collection-grid").innerHTML=ALL_CARDS.map(c=>{
    const cnt=gameState.collection.filter(x=>x===c.id).length;
    const own=cnt>0;
    return`<div class="card-mini rarity-${c.rarity} ${own?'':'locked'}">
      <div class="emo">${c.emoji}</div><div class="cname">${c.name}</div>
      <div class="cstats">⚔${c.atk} ❤${c.hp}</div>
      <div class="cstats">✨${c.passiveName}</div>
      <div class="crarity">${RARITY_LABEL[c.rarity]}${own?` (x${cnt})`:''}</div></div>`;
  }).join("");
}

// === МАГАЗИН ===
function refreshShop(){
  document.getElementById("shop-coins").textContent=`🪙 ${gameState.coins}`;
  const today=new Date().toISOString().slice(0,10);
  const du=gameState.lastDaily===today;
  document.getElementById("shop-packs").innerHTML=PACKS.map(p=>{
    const dis=p.daily?du:gameState.coins<p.price;
    return`<div class="pack ${p.daily?'pack-free':''} ${dis?'pack-disabled':''}" onclick="buyPack('${p.id}')">
      <div class="pack-icon">${p.icon}</div><div class="pack-name">${p.name}</div>
      <div class="pack-info">${p.desc}</div>
      <div class="pack-price">${p.daily?(du?'✅ Получен сегодня':'🆓 Бесплатно!'):`🪙 ${p.price}`}</div></div>`;
  }).join("");
}

function buyPack(pid){
  const p=PACKS.find(x=>x.id===pid);if(!p)return;
  if(p.daily){const t=new Date().toISOString().slice(0,10);if(gameState.lastDaily===t)return;gameState.lastDaily=t;}
  else{if(gameState.coins<p.price)return;gameState.coins-=p.price;}
  const cards=generatePack(p.cards,p.filter);
  cards.forEach(c=>gameState.collection.push(c.id));
  saveState();showReveal(p.name,cards);
}

function generatePack(count,filter){
  const res=[];
  for(let i=0;i<count;i++){
    const rar=rollRarity();
    let pool=ALL_CARDS.filter(c=>c.rarity===rar);
    if(filter&&Math.random()<0.7){const f=ALL_CARDS.filter(c=>c.pack===filter&&c.rarity===rar);if(f.length>0)pool=f;}
    if(pool.length===0)pool=ALL_CARDS.filter(c=>c.rarity==="common");
    res.push(pool[Math.floor(Math.random()*pool.length)]);
  }return res;
}

function rollRarity(){
  const r=Math.random()*100;
  if(r<RARITY_WEIGHTS.legendary)return"legendary";
  if(r<RARITY_WEIGHTS.legendary+RARITY_WEIGHTS.epic)return"epic";
  if(r<RARITY_WEIGHTS.legendary+RARITY_WEIGHTS.epic+RARITY_WEIGHTS.rare)return"rare";
  return"common";
}

function showReveal(name,cards){
  document.getElementById("pr-title").textContent=`🎁 ${name}`;
  document.getElementById("pr-cards").innerHTML=cards.map(c=>
    `<div class="pr-card rarity-${c.rarity}"><div class="emo">${c.emoji}</div>
    <div class="cname">${c.name}</div><div class="cstats" style="color:#aaa;font-size:0.8em">⚔${c.atk} ❤${c.hp}</div>
    <div class="crarity">${RARITY_LABEL[c.rarity]}</div></div>`).join("");
  document.getElementById("pack-reveal").classList.add("active");
}
function closeReveal(){document.getElementById("pack-reveal").classList.remove("active");refreshShop();}

// === ВЫБОР КАРТ ===
let defenseSelection=[],attackSelection=[];

function renderSelectionGrid(gid,sel,fn){
  const owned=[...new Set(gameState.collection)];
  document.getElementById(gid).innerHTML=owned.map(id=>{
    const c=ALL_CARDS.find(x=>x.id===id);const s=sel.includes(id);
    return`<div class="card-mini rarity-${c.rarity} ${s?'selected':''}" onclick="${fn}('${id}')">
      <div class="emo">${c.emoji}</div><div class="cname">${c.name}</div>
      <div class="cstats">⚔${c.atk} ❤${c.hp}</div><div class="cstats">✨${c.passiveName}</div>
      <div class="crarity">${RARITY_LABEL[c.rarity]}</div></div>`;
  }).join("");
}

function refreshDefense(){defenseSelection=[...gameState.defense];renderSelectionGrid("defense-grid",defenseSelection,"toggleDefense");updateDefBtn();}
function toggleDefense(id){const i=defenseSelection.indexOf(id);if(i>=0)defenseSelection.splice(i,1);else if(defenseSelection.length<3)defenseSelection.push(id);renderSelectionGrid("defense-grid",defenseSelection,"toggleDefense");updateDefBtn();}
function updateDefBtn(){document.getElementById("def-confirm").disabled=defenseSelection.length!==3;}
function saveDefense(){gameState.defense=[...defenseSelection];saveState();alert("Защита сохранена!");showScreen("screen-menu");}

function refreshAttackPick(){attackSelection=[];renderSelectionGrid("attack-grid",attackSelection,"toggleAttack");updateAtkBtn();}
function toggleAttack(id){const i=attackSelection.indexOf(id);if(i>=0)attackSelection.splice(i,1);else if(attackSelection.length<3)attackSelection.push(id);renderSelectionGrid("attack-grid",attackSelection,"toggleAttack");updateAtkBtn();}
function updateAtkBtn(){document.getElementById("atk-confirm").disabled=attackSelection.length!==3;}
    // === БОЙ ===
let battleTeamA=[],battleTeamD=[];

function startBattleScreen(){
  battleTeamA=attackSelection.map(id=>makeCard(id));
  battleTeamD=generateBotDefense();
  showScreen("screen-battle");
  document.getElementById("fight-btn").disabled=false;
  document.getElementById("battle-log").innerHTML="";
  renderBattle();
}

function generateBotDefense(){
  const pool=[...ALL_CARDS];const t=[];
  for(let i=0;i<3;i++){t.push(makeCard(pool[Math.floor(Math.random()*pool.length)].id));}
  return t;
}

function makeCard(id){
  const b=ALL_CARDS.find(c=>c.id===id);
  return{...b,curHp:b.hp,maxHp:b.hp,curAtk:b.atk,mushroomUsed:false,shieldRemaining:3,dealtDmgLastRound:false,side:""};
}

function renderBattle(){renderBTeam("b-team-a",battleTeamA);renderBTeam("b-team-d",battleTeamD);}
function renderBTeam(eid,team){
  document.getElementById(eid).innerHTML=team.map(c=>
    `<div class="card-b ${c.curHp<=0?'dead':''}"><div class="emo">${c.emoji}</div>
    <div class="cname">${c.name}</div><div class="atk-v">⚔${c.curAtk}</div>
    <div class="hp-v">❤${Math.max(0,c.curHp)}/${c.maxHp}</div>
    ${c.id==='chief'&&c.shieldRemaining>0?`<div style="color:#60a5fa">🛡${c.shieldRemaining}</div>`:''}</div>`).join("");
}

function runBattle(){
  const log=document.getElementById("battle-log");
  const btn=document.getElementById("fight-btn");
  log.innerHTML="";btn.disabled=true;
  battleTeamA.forEach(c=>{c.side="a"});
  battleTeamD.forEach(c=>{c.side="d"});
  const add=(t,cls="")=>{log.innerHTML+=`<div class="${cls}">${t}</div>`;log.scrollTop=log.scrollHeight;};
  add("🏁 <b>БОЙ НАЧАЛСЯ!</b>");
  let round=1;

  const loop=setInterval(()=>{
    add(`<br>— Раунд ${round} —`,"lr");

    [...battleTeamA,...battleTeamD].forEach(c=>{
      if(c.id==="knight"&&c.dealtDmgLastRound&&c.curHp>0){
        c.curHp=Math.min(c.maxHp,c.curHp+1);
        add(`🖤 ${c.name}: Фокус Душ +1HP (${c.curHp}/${c.maxHp})`,"lp");
      }
      c.dealtDmgLastRound=false;
    });

    const queue=[];
    const mx=Math.max(battleTeamA.length,battleTeamD.length);
    for(let i=0;i<mx;i++){
      if(battleTeamA[i])queue.push({card:battleTeamA[i],enemies:battleTeamD,allies:battleTeamA});
      if(battleTeamD[i])queue.push({card:battleTeamD[i],enemies:battleTeamA,allies:battleTeamD});
    }
    queue.sort((a,b)=>(b.card.id==="sonic"?1:0)-(a.card.id==="sonic"?1:0));

    for(const turn of queue){
      const card=turn.card;
      if(card.curHp<=0)continue;
      const target=turn.enemies.find(c=>c.curHp>0);
      if(!target)continue;
      const tag=turn.allies===battleTeamA?"🔵":"🔴";

      if(card.id==="doom"&&target.curHp<=3&&target.curHp>0){
        target.curHp=0;
        add(`${tag} ${card.emoji} ${card.name} → 💀 ${target.name} ДОБИВАНИЕ!`,"lk");
        card.dealtDmgLastRound=true;
        onKill(card,target,turn.allies,add);
        renderBattle();
        if(checkEnd(add,loop,btn))return;
        continue;
      }

      let dmg=card.curAtk;
      if(card.id==="geralt"&&target.curAtk>card.curAtk){dmg+=2;add(`${tag} 🐺 Эликсиры! +2ATK`,"lp");}

      add(`${tag} ${card.emoji} ${card.name} → ${target.emoji} ${target.name} (-${dmg})`,"lh");
      applyDamage(target,dmg,add);
      card.dealtDmgLastRound=true;

      if(card.id==="pikachu"&&target.curHp>0&&Math.random()<0.5){target.curHp-=2;add(`${tag} ⚡ Статика! +2 урона`,"lp");}
      if(card.id==="steve"){card.maxHp+=1;card.curHp+=1;add(`${tag} ⛏ Крафт! HP→${card.curHp}/${card.maxHp}`,"lp");}

      if(target.curHp<=0){
        add(`💀 ${target.emoji} ${target.name} повержен!`,"lk");
        onKill(card,target,turn.allies,add);
      }
      renderBattle();
      if(checkEnd(add,loop,btn))return;
    }
    round++;
    if(round>30){
      clearInterval(loop);btn.disabled=false;
      const hpA=battleTeamA.reduce((s,c)=>s+Math.max(0,c.curHp),0);
      const hpD=battleTeamD.reduce((s,c)=>s+Math.max(0,c.curHp),0);
      if(hpA>hpD){add("<br>🏆 ПОБЕДА! (по HP)","lw");onWin();}
      else if(hpD>hpA){add("<br>💔 ПОРАЖЕНИЕ","lw");onLose();}
      else add("<br>🤝 НИЧЬЯ","lw");
    }
  },1000);
}

function applyDamage(target,dmg,add){
  if(target.id==="chief"&&target.shieldRemaining>0){
    const bl=Math.min(dmg,target.shieldRemaining);target.shieldRemaining-=bl;dmg-=bl;
    if(bl>0)add(`🛡 ${target.name}: щит -${bl} (ост. ${target.shieldRemaining})`,"ls");
    if(dmg<=0)return;
  }
  target.curHp-=dmg;
  if(target.id==="kratos"&&dmg>0&&target.curHp>0){target.curAtk+=1;add(`🪓 ${target.name}: Ярость! ATK→${target.curAtk}`,"lp");}
  if(target.id==="mario"&&!target.mushroomUsed&&target.curHp>0&&target.curHp<5){
    target.mushroomUsed=true;target.curHp+=4;target.curAtk+=1;
    add(`🍄 ${target.name}: Супер-гриб! +4HP ATK→${target.curAtk}`,"lp");
  }
}

function onKill(killer,victim,allies,add){
  if(killer.id==="lara"){const nx=allies.find(c=>c.curHp>0&&c!==killer);
    if(nx){nx.maxHp+=2;nx.curHp+=2;add(`🔫 Сокровища! ${nx.name} +2HP`,"lp");}}
}

function checkEnd(add,loop,btn){
  const aA=battleTeamA.filter(c=>c.curHp>0).length;
  const dA=battleTeamD.filter(c=>c.curHp>0).length;
  if(aA===0||dA===0){
    clearInterval(loop);btn.disabled=false;
    if(aA>0){add("<br>🏆 ПОБЕДА!","lw");onWin();}
    else if(dA>0){add("<br>💔 ПОРАЖЕНИЕ","lw");onLose();}
    else add("<br>🤝 НИЧЬЯ","lw");
    return true;
  }return false;
}

function onWin(){
  const r=30+Math.floor(Math.random()*20);
  gameState.coins+=r;gameState.wins++;saveState();
  document.getElementById("battle-log").innerHTML+=`<div class="lw">+${r} 🪙</div>`;
}

function onLose(){
  const r=5+Math.floor(Math.random()*10);
  gameState.coins+=r;gameState.losses++;saveState();
  document.getElementById("battle-log").innerHTML+=`<div style="color:#888">+${r} 🪙</div>`;
}

refreshMenu();
</script>
</body>
</html>
