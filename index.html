<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Автобатлер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="screen-menu" class="screen active">
    <h1>⚔️ Автобатлер</h1>
    <div class="menu-stats">
      <span id="menu-coins">🪙 0</span>
      <span id="menu-wins">🏆 0</span>
      <span id="menu-losses">💀 0</span>
      <span id="menu-cards">🎴 0</span>
    </div>
    <div class="menu-buttons">
      <button onclick="showScreen('screen-battle-pick')">⚔️ Бой</button>
      <button onclick="showScreen('screen-defense')">🛡️ Защита</button>
      <button onclick="showScreen('screen-collection')">🎴 Коллекция</button>
      <button onclick="showScreen('screen-shop')">🛒 Магазин</button>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div id="screen-shop" class="screen">
    <h2>🛒 Магазин</h2>
    <p id="shop-coins">🪙 0</p>
    <div id="shop-list"></div>
    <button onclick="showScreen('screen-menu')">← Назад</button>
  </div>

  <!-- КОЛЛЕКЦИЯ -->
  <div id="screen-collection" class="screen">
    <h2>🎴 Коллекция</h2>
    <div id="collection-list"></div>
    <button onclick="showScreen('screen-menu')">← Назад</button>
  </div>

  <!-- ЗАЩИТА -->
  <div id="screen-defense" class="screen">
    <h2>🛡️ Команда защиты <span id="defense-count">0/3</span></h2>
    <div id="defense-list"></div>
    <button onclick="showScreen('screen-menu')">← Назад</button>
  </div>

  <!-- ВЫБОР КАРТ ДЛЯ БОЯ -->
  <div id="screen-battle-pick" class="screen">
    <h2>⚔️ Выбери 3 карты <span id="battle-pick-count">0/3</span></h2>
    <div id="battle-pick-list"></div>
    <button onclick="startBattle()">🗡️ В бой!</button>
    <button onclick="showScreen('screen-menu')">← Назад</button>
  </div>

  <!-- БОЙ -->
  <div id="screen-battle" class="screen">
    <h2>⚔️ Бой</h2>
    <div class="battle-teams">
      <div>
        <h3>🔵 Атака</h3>
        <div id="battle-atk"></div>
      </div>
      <div>
        <h3>🔴 Защита</h3>
        <div id="battle-def"></div>
      </div>
    </div>
    <div id="battle-log"></div>
  </div>

  <!-- МОДАЛКА ПАКА -->
  <div id="pack-reveal" class="modal">
    <h2>🎉 Новые карты!</h2>
    <div id="reveal-cards"></div>
    <button onclick="closeReveal()">Забрать</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
